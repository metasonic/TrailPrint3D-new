worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Gzip compression for web assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream api {
        server app:8000;
    }

    server {
        listen 80;
        server_name _;

        # API routes — proxy to FastAPI
        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support — disable buffering for /stream endpoints
            location ~* /api/jobs/[^/]+/stream {
                proxy_pass http://api;
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 3600s;
                proxy_set_header Connection '';
                proxy_http_version 1.1;
                chunked_transfer_encoding on;
            }

            # Large file downloads
            location ~* /api/jobs/[^/]+/files/ {
                proxy_pass http://api;
                proxy_read_timeout 300s;
                proxy_buffering off;
            }
        }

        # Health check
        location /health {
            proxy_pass http://api/health;
        }

        # React SPA — serve static build, fallback to index.html
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
