[tool.poetry]
name = "trailprint3d-web"
version = "0.1.0"
description = "Self-hosted web app that turns a GPX file into a 3D-printable terrain model."
authors = ["TrailPrint3D Web"]
license = "GPL-3.0-or-later"
readme = "README.md"
packages = [
    { include = "backend" },
    { include = "pipeline" },
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
pydantic = "^2.9"
pydantic-settings = "^2.6"
celery = { extras = ["redis"], version = "^5.4" }
redis = "^5.2"
python-multipart = "^0.0.20"
gpxpy = "^1.6"
numpy = "^2.1"
scipy = "^1.14"
rasterio = "^1.4"
elevation = "^1.1.3"
pyproj = "^3.7"
shapely = "^2.0"
trimesh = "^4.5"
manifold3d = "^3.0"
networkx = "^3.4"
rtree = "^1.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
httpx = "^0.28"
ruff = "^0.8"
mypy = "^1.13"

[build-system]
requires = ["poetry-core>=1.8"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
