[project]
name = "trailprint3d-backend"
version = "0.1.0"
description = "FastAPI backend for TrailPrint3D"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "rq>=1.16.2",
    "redis>=5.0.4",
    "bpy==4.2.0",
    "python-multipart>=0.0.9",
    "gpxpy>=1.6.2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trailprint3d_backend"]
