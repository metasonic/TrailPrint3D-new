upstream api_upstream {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Accept large file uploads (GPX files up to ~20 MB)
    client_max_body_size 20m;

    # Proxy FastAPI: REST endpoints and static file serving
    location /api/ {
        proxy_pass         http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;  # generation jobs can take up to 10 min
    }

    location /files/ {
        proxy_pass       http://api_upstream;
        proxy_buffering  off;   # stream 3D model files directly
        proxy_read_timeout 60s;
    }

    # Astro hashed assets — cache forever
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon and other root-level static files
    location ~* \.(svg|ico|png|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # All other requests → index.html (Astro page)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
