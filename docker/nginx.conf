load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # glTF binary isn't in the default mime.types — register it so the
    # browser handles the preview download correctly.
    types {
        model/gltf-binary glb;
        model/gltf+json   gltf;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    server_tokens off;

    # GPX uploads are capped at MAX_UPLOAD_SIZE_MB=10 in the backend; allow a
    # bit more here so the backend returns a clean 413 rather than nginx.
    client_max_body_size 32m;
    client_body_buffer_size 256k;

    # Brotli (preferred when the client supports it)
    brotli              on;
    brotli_static       on;
    brotli_comp_level   5;
    brotli_min_length   1024;
    brotli_types
        application/javascript
        application/json
        application/wasm
        application/xml
        image/svg+xml
        model/gltf+json
        text/css
        text/javascript
        text/plain
        text/xml;

    # gzip fallback for clients without brotli support
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/xml
        image/svg+xml
        model/gltf+json
        text/css
        text/javascript
        text/plain
        text/xml;

    upstream tp3d_backend  { server backend:8000; }
    upstream tp3d_frontend { server frontend:4321; }

    server {
        listen 80 default_server;
        server_name _;

        # Backend API
        location /api/ {
            proxy_pass         http://tp3d_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # Generated mesh files (STL/OBJ/3MF/GLB). GLBs are already binary;
        # brotli won't shrink them much, but text/json sidecars compress well.
        location /files/ {
            proxy_pass         http://tp3d_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Hint a friendly download filename when the URL is a UUID.glb
            add_header Cache-Control "no-store" always;
        }

        # Astro SSR + static assets
        location / {
            proxy_pass         http://tp3d_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket upgrade for Vite HMR / Astro dev (no-op in production
            # but harmless and lets the same config double as a dev proxy).
            proxy_set_header   Upgrade  $http_upgrade;
            proxy_set_header   Connection "upgrade";
        }
    }
}
