services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      OUTPUT_DIR: /app/output
      BLENDER_EXECUTABLE: /usr/local/bin/blender
      BLENDER_SCRIPT_PATH: /app/scripts/generate_terrain.py
      MAX_UPLOAD_SIZE_MB: "10"
    volumes:
      - output_data:/app/output
    ports:
      - "8000:8000"   # direct API access; in production only frontend exposes port 80
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.celery_app
      - worker
      - --loglevel=info
      - --concurrency=1    # one Blender process per replica — scale replicas, not concurrency
    environment:
      REDIS_URL: redis://redis:6379/0
      OUTPUT_DIR: /app/output
      BLENDER_EXECUTABLE: /usr/local/bin/blender
      BLENDER_SCRIPT_PATH: /app/scripts/generate_terrain.py
    volumes:
      - output_data:/app/output
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2           # 2 concurrent jobs by default; raise with --scale worker=N
      resources:
        limits:
          memory: 3g        # OOM-kills runaway jobs cleanly; prevents host thrash
        reservations:
          memory: 1g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  redis_data:
  output_data:
