version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uvicorn trailprint3d_backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - UPLOAD_DIR=/data/uploads
      - OUTPUT_DIR=/data/outputs
      - MAX_UPLOAD_SIZE=52428800
      - TERRAIN_RESOLUTION=100
      - ELEVATION_DATA_SOURCE=opentopodata
      - OPENTOPOGRAPHY_KEY=${OPENTOPOGRAPHY_KEY:-}
    volumes:
      - app_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python -m trailprint3d_backend.worker
    environment:
      - REDIS_URL=redis://redis:6379
      - UPLOAD_DIR=/data/uploads
      - OUTPUT_DIR=/data/outputs
      - TERRAIN_RESOLUTION=100
      - ELEVATION_DATA_SOURCE=opentopodata
      - OPENTOPOGRAPHY_KEY=${OPENTOPOGRAPHY_KEY:-}
    volumes:
      - app_data:/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
  app_data:
