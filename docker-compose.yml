services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - tp3d_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    command: >
      bash -c "
        Xvfb :99 -screen 0 1280x720x24 &
        until xdpyinfo -display :99 >/dev/null 2>&1; do sleep 0.1; done
        export DISPLAY=:99
        exec celery -A backend.app.celery_app worker
          --loglevel=info
          --concurrency=${CELERY_CONCURRENCY:-2}
          -Q default
      "
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - TP3D_HEADLESS=1
      - DISPLAY=:99
    volumes:
      - tp3d_data:/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  tp3d_data:
  redis_data:
